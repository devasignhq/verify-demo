name: DevAsign verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  repository_dispatch:
    types: [devasign-verify]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: devasignhq/verify-action@v1
